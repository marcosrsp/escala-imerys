<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Escala Imerys</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <link id="pwa-manifest" rel="manifest">
    <link id="app-favicon" rel="icon" type="image/png" href="./icon-192.png">
    <link id="apple-icon" rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Escala Imerys">
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                darkMode: 'media',
                theme: {
                    extend: {
                        colors: { oled: '#000000', surface: '#0a0a0a', surfaceBorder: '#1a1a1a' },
                        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] },
                        animation: {
                            'pulse-slow': 'pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                            'fade-in': 'fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                            'bounce-subtle': 'bounceSubtle 2.2s ease-in-out infinite'
                        },
                        keyframes: {
                            fadeIn: { '0%': { opacity: '0', transform: 'translate3d(0, 8px, 0)' }, '100%': { opacity: '1', transform: 'translate3d(0, 0, 0)' } },
                            bounceSubtle: { '0%, 100%': { transform: 'translate3d(0, 0, 0)' }, '50%': { transform: 'translate3d(0, -3px, 0)' } }
                        }
                    }
                }
            };
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html { text-size-adjust: 100%; -webkit-text-size-adjust: 100%; }
        body {
            background-color: #f1f5f9;
            color: #0f172a;
            overscroll-behavior-y: none;
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            body { background-color: #000000; color: #f8fafc; }
        }

        /* Proteção iOS/Android contra seleção indesejada preservando inputs */
        .ios-no-callout { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }

        /* Remove setinhas nativas do input numérico no Chrome, Safari, Edge e Firefox (PC) */
        input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* Foco acessível limpo para navegação por teclado no PC */
        :focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
        input:focus-visible, textarea:focus-visible { outline: none; }

        /* Safe Areas (iPhone Notch / Dynamic Island / Gesture Bar) */
        .pt-safe { padding-top: 1rem; }
        .pb-safe { padding-bottom: 1.25rem; }
        @supports (padding-top: env(safe-area-inset-top)) {
            .pt-safe { padding-top: calc(env(safe-area-inset-top) + 0.85rem); }
            .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 1.25rem); }
        }

        /* Isolamento de layout para telas de 60Hz/90Hz/120Hz/144Hz */
        .contain-section { contain: layout style; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-header {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }
        .table-scroll {
            touch-action: pan-x pan-y;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
            contain: layout style;
        }
        .table-scroll::-webkit-scrollbar { display: none; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .app-shell { overflow-x: clip; }

        /* Coluna fixa promovida à GPU */
        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 20;
            transform: translate3d(0, 0, 0);
            -webkit-transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* Barra fina e discreta na tabela em telas de PC */
        @media (min-width: 768px) {
            .table-scroll { scrollbar-width: thin; scrollbar-color: rgba(148, 163, 184, 0.45) transparent; }
            .table-scroll::-webkit-scrollbar { display: block; height: 7px; }
            .table-scroll::-webkit-scrollbar-track { background: transparent; }
            .table-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.42); border-radius: 9999px; }
            .table-scroll::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.68); }
            @media (prefers-color-scheme: dark) {
                .table-scroll { scrollbar-color: rgba(82, 82, 91, 0.65) transparent; }
                .table-scroll::-webkit-scrollbar-thumb { background: rgba(63, 63, 70, 0.7); }
                .table-scroll::-webkit-scrollbar-thumb:hover { background: rgba(113, 113, 122, 0.9); }
            }
        }

        /* Modais acelerados 100% no compositor GPU */
        .modal-backdrop {
            transition: opacity 0.24s cubic-bezier(0.16, 1, 0.3, 1);
            overscroll-behavior: contain;
        }
        .modal-sheet {
            transform: translate3d(0, 100%, 0);
            transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
            overscroll-behavior: contain;
            contain: layout style;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .modal-sheet.is-open { transform: translate3d(0, 0, 0); }
        @media (min-width: 768px) {
            .modal-sheet {
                transform: translate3d(0, 14px, 0) scale3d(0.96, 0.96, 1);
                opacity: 0;
            }
            .modal-sheet.is-open {
                transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
                opacity: 1;
            }
        }
        .modal-dialog {
            transform: translate3d(0, 10px, 0) scale3d(0.95, 0.95, 1);
            opacity: 0;
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
            overscroll-behavior: contain;
            contain: layout style;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .modal-dialog.is-open {
            transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
            opacity: 1;
        }

        /* Transições direcionadas sem repaint de sombra */
        .btn-smooth {
            transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, opacity 0.16s ease;
        }
        .cell-smooth {
            transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.16s ease;
        }
        .cell-active { isolation: isolate; }
        .cell-active::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-color: rgba(15, 23, 42, 0.06);
            opacity: 0;
            transition: opacity 0.14s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @media (prefers-color-scheme: dark) {
            .cell-active::after { background-color: rgba(255, 255, 255, 0.09); }
        }
        @media (hover: hover) and (pointer: fine) {
            .cell-active:hover::after { opacity: 1; }
        }

        /* =========================================================
           FOLHA A4 HORIZONTAL (PRÉVIA EM TELA + IMPRESSÃO NATIVA)
           ========================================================= */
        #print-sheet { display: none; }
        .a4-preview-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 297 / 210;
            background: #ffffff;
            overflow: hidden;
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 8px 24px -8px rgba(15, 23, 42, 0.18);
        }
        @media (prefers-color-scheme: dark) {
            .a4-preview-frame { border-color: #27272a; box-shadow: 0 10px 28px -8px rgba(0, 0, 0, 0.7); }
        }
        .a4-preview-scaler {
            position: absolute;
            top: 0;
            left: 0;
            width: 1122px;
            height: 793px;
            transform-origin: top left;
            pointer-events: none;
        }

        .a4-sheet {
            width: 1122px;
            height: 793px;
            box-sizing: border-box;
            background: #ffffff;
            color: #0f172a;
            padding: 26px 28px 22px 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .a4-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 12px;
            border-bottom: 2.5px solid #0f172a;
        }
        .a4-brand { display: flex; align-items: center; gap: 14px; }
        .a4-logo {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            border: 1.5px solid #cbd5e1;
            background: #ffffff;
            object-fit: contain;
            flex-shrink: 0;
        }
        .a4-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: #0f172a;
            line-height: 1.05;
            margin: 0;
        }
        .a4-subtitle {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #475569;
            margin-top: 4px;
        }
        .a4-period-box {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        .a4-month-pill {
            display: inline-block;
            background: #0f172a;
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 6px 18px;
            border-radius: 10px;
            line-height: 1.1;
        }
        .a4-cycle-note {
            font-size: 10.5px;
            font-weight: 700;
            color: #475569;
        }

        .a4-table-wrap {
            margin-top: 12px;
            border: 1.5px solid #334155;
            border-radius: 10px;
            overflow: hidden;
        }
        .a4-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .a4-table th, .a4-table td {
            border-right: 1px solid #cbd5e1;
            border-bottom: 1px solid #cbd5e1;
            text-align: center;
            vertical-align: middle;
            padding: 0;
        }
        .a4-table tr > *:last-child { border-right: none; }
        .a4-table tbody tr:last-child > * { border-bottom: none; }

        .a4-th-team {
            width: 158px;
            background: #f1f5f9;
            color: #0f172a;
            text-align: left !important;
            padding: 8px 12px !important;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-right: 2px solid #475569 !important;
            border-bottom: 2px solid #475569 !important;
        }
        .a4-th-day {
            background: #f8fafc;
            border-bottom: 2px solid #475569 !important;
            padding: 6px 1px !important;
            height: 44px;
            position: relative;
        }
        .a4-th-day.is-sun { background: #fef2f2; }
        .a4-th-day.is-holi { background: #fee2e2; box-shadow: inset 0 3px 0 #dc2626; }
        .a4-day-num {
            display: block;
            font-size: 13px;
            font-weight: 900;
            line-height: 1.1;
            color: #0f172a;
            font-variant-numeric: tabular-nums;
        }
        .a4-day-dow {
            display: block;
            font-size: 8px;
            font-weight: 800;
            line-height: 1.1;
            color: #64748b;
            margin-top: 2px;
        }
        .a4-th-day.is-sun .a4-day-num, .a4-th-day.is-sun .a4-day-dow { color: #dc2626; }
        .a4-th-day.is-holi .a4-day-num, .a4-th-day.is-holi .a4-day-dow { color: #b91c1c; }

        .a4-td-team {
            text-align: left !important;
            padding: 8px 12px !important;
            background: #ffffff;
            border-right: 2px solid #475569 !important;
            height: 66px;
        }
        .a4-team-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 900;
            color: #0f172a;
            line-height: 1.15;
        }
        .a4-team-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 6px;
            background: #0f172a;
            color: #ffffff;
            font-size: 11px;
            font-weight: 900;
            flex-shrink: 0;
        }
        .a4-team-names {
            display: block;
            font-size: 10.5px;
            font-weight: 700;
            color: #475569;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 134px;
        }

        .a4-cell {
            height: 66px;
            font-size: 15px;
            font-weight: 900;
            position: relative;
        }
        .a4-cell-M { background: #dbeafe; color: #1e40af; }
        .a4-cell-T { background: #ffedd5; color: #9a3412; }
        .a4-cell-N { background: #e0e7ff; color: #3730a3; }
        .a4-cell-F { background: #dcfce7; color: #15803d; }
        .a4-cell-AT { background: #ffe4e6; color: #be123c; box-shadow: inset 0 0 0 2px #f43f5e; }
        .a4-cell-ov { box-shadow: inset 0 0 0 2.5px #d97706; }
        .a4-cell-sub {
            display: block;
            font-size: 7.5px;
            font-weight: 900;
            line-height: 1;
            margin-top: 2px;
            letter-spacing: -0.02em;
        }

        .a4-bottom-grid {
            margin-top: 14px;
            display: grid;
            grid-template-columns: 1.05fr 1.25fr 1.1fr;
            gap: 14px;
            flex: 1;
            min-height: 0;
        }
        .a4-card {
            border: 1.2px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            padding: 11px 13px;
            display: flex;
            flex-direction: column;
        }
        .a4-card-title {
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #334155;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid #cbd5e1;
        }
        .a4-legend-list { display: flex; flex-direction: column; gap: 6px; }
        .a4-legend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 7px;
            padding: 5px 8px;
        }
        .a4-legend-left { display: flex; align-items: center; gap: 8px; }
        .a4-legend-chip {
            width: 24px;
            height: 22px;
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
        }
        .a4-legend-name { font-size: 11.5px; font-weight: 800; color: #0f172a; }
        .a4-legend-hours { font-size: 11px; font-weight: 800; color: #334155; font-variant-numeric: tabular-nums; }
        .a4-legend-extra {
            margin-top: auto;
            padding-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 9.5px;
            font-weight: 700;
            color: #475569;
        }

        .a4-summary-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            overflow: hidden;
        }
        .a4-summary-table th {
            background: #e2e8f0;
            color: #334155;
            font-size: 9.5px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 6px 6px;
            text-align: center;
            border-bottom: 1px solid #cbd5e1;
        }
        .a4-summary-table th:first-child { text-align: left; padding-left: 9px; }
        .a4-summary-table td {
            padding: 7px 6px;
            font-size: 11.5px;
            font-weight: 800;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
            font-variant-numeric: tabular-nums;
        }
        .a4-summary-table tr:last-child td { border-bottom: none; }
        .a4-summary-table td:first-child { text-align: left; padding-left: 9px; color: #0f172a; }
        .a4-sum-sub { display: block; font-size: 9px; font-weight: 600; color: #64748b; max-width: 155px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .a4-holi-list { display: flex; flex-direction: column; gap: 6px; }
        .a4-holi-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            border: 1px solid #fecaca;
            border-left: 3.5px solid #dc2626;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 11px;
        }
        .a4-holi-date { font-weight: 900; color: #b91c1c; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .a4-holi-name { font-weight: 700; color: #1e293b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .a4-holi-empty {
            margin: auto 0;
            text-align: center;
            padding: 18px 10px;
            font-size: 11.5px;
            font-weight: 700;
            color: #64748b;
            background: #ffffff;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
        }

        .a4-footer {
            margin-top: 10px;
            padding-top: 7px;
            border-top: 1px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 9.5px;
            font-weight: 700;
            color: #64748b;
        }

        /* =========================================================
           RELATÓRIO GERENCIAL DE OBSERVAÇÕES (ENCARREGADO / SUPERVISOR)
           ========================================================= */
        .a4-preview-frame.is-report-scroll {
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        .a4-preview-spacer {
            position: relative;
            width: 100%;
            min-height: 100%;
        }
        .a4-sheet.a4-report-sheet {
            height: auto;
            min-height: 793px;
            justify-content: flex-start;
        }
        .a4-kpi-grid {
            margin-top: 14px;
            display: grid;
            grid-template-columns: 0.9fr 0.9fr 1.65fr 1.05fr;
            gap: 10px;
        }
        .a4-kpi-card {
            border: 1.2px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            padding: 9px 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .a4-kpi-label {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #475569;
        }
        .a4-kpi-val {
            font-size: 21px;
            font-weight: 900;
            color: #0f172a;
            line-height: 1.15;
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }
        .a4-kpi-sub {
            font-size: 9.5px;
            font-weight: 700;
            color: #64748b;
            margin-top: 2px;
        }
        .a4-kpi-chips {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 5px;
            flex-wrap: wrap;
        }
        .a4-kpi-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 6px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            font-size: 10.5px;
            font-weight: 800;
            color: #0f172a;
            font-variant-numeric: tabular-nums;
        }
        .a4-obs-wrap {
            margin-top: 14px;
            border: 1.5px solid #334155;
            border-radius: 10px;
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }
        .a4-obs-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .a4-obs-table thead { display: table-header-group; }
        .a4-obs-table th {
            background: #f1f5f9;
            color: #0f172a;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: left;
            padding: 9px 11px;
            border-bottom: 2px solid #475569;
            border-right: 1px solid #cbd5e1;
        }
        .a4-obs-table th:last-child { border-right: none; }
        .a4-obs-table td {
            padding: 9px 11px;
            border-bottom: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
            vertical-align: top;
            font-size: 11.5px;
            color: #0f172a;
        }
        .a4-obs-table td:last-child { border-right: none; }
        .a4-obs-table tbody tr:nth-child(even) td { background: #f8fafc; }
        .a4-obs-table tbody tr:last-child td { border-bottom: none; }
        .a4-obs-date {
            font-size: 13px;
            font-weight: 900;
            color: #0f172a;

    <script>
        /* 0. UTILITÁRIOS DE FLUIDEZ ADAPTATIVA (60Hz / 90Hz / 120Hz / 144Hz+ NATIVO) */
        const reducedMotionMQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
        function prefersReducedMotion() { return Boolean(reducedMotionMQ && reducedMotionMQ.matches); }

        /* 1. MOTOR DE ÍCONE OFICIAL IMERYS HD */
        const IMERYS_ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
                <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f2f6fc"/></linearGradient>
                <radialGradient id="disc" cx="68%" cy="28%" r="72%" fx="74%" fy="22%"><stop offset="0%" stop-color="#ffffff"/><stop offset="18%" stop-color="#a8ccff"/><stop offset="48%" stop-color="#2b64c6"/><stop offset="80%" stop-color="#143d8f"/><stop offset="100%" stop-color="#081b45"/></radialGradient>
                <radialGradient id="dot" cx="62%" cy="28%" r="72%"><stop offset="0%" stop-color="#ffffff"/><stop offset="28%" stop-color="#93c5fd"/><stop offset="66%" stop-color="#235cc2"/><stop offset="100%" stop-color="#0b2358"/></radialGradient>
                <linearGradient id="stem" x1="0%" y1="35%" x2="100%" y2="55%"><stop offset="0%" stop-color="#9ca3af"/><stop offset="22%" stop-color="#ffffff"/><stop offset="42%" stop-color="#d1d5db"/><stop offset="56%" stop-color="#1f2937"/><stop offset="70%" stop-color="#000000"/><stop offset="100%" stop-color="#050505"/></linearGradient>
                <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="-2" dy="6" stdDeviation="5" flood-color="#0a1938" flood-opacity="0.22"/></filter>
            </defs>
            <rect width="512" height="512" fill="url(#bg)"/>
            <g filter="url(#sh)">
                <ellipse cx="253" cy="245" rx="108" ry="67" transform="rotate(-37 253 245)" fill="#07183b"/>
                <ellipse cx="256" cy="239" rx="106" ry="65" transform="rotate(-37 256 239)" fill="url(#disc)"/>
            </g>
            <path d="M206 177 Q246 149 289 155 Q272 183 238 190 Q214 195 206 177 Z" fill="url(#bg)"/>
            <path d="M224 185 C216 212 218 242 229 257 C242 271 272 263 281 244 C272 222 270 198 275 170 C260 183 240 190 224 185 Z" fill="url(#stem)"/>
            <path d="M227 254 C239 269 270 263 281 245" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>
            <ellipse cx="261" cy="134" rx="35" ry="16" transform="rotate(-34 261 134)" fill="#0a2050"/>
            <ellipse cx="262" cy="131" rx="34" ry="15" transform="rotate(-34 262 131)" fill="url(#dot)"/>
            <g fill="#0a0d14" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="800" font-size="44" text-anchor="middle">
                <text x="148" y="398">I</text><text x="188" y="398">M</text><text x="234" y="398">E</text>
                <text x="276" y="398">R</text><text x="318" y="398">Y</text><text x="360" y="398">S</text>
            </g>
        </svg>`;

        const IMERYS_SVG_URI = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(IMERYS_ICON_SVG);
        const iconPngCache = {};

        function renderIconPNG(size) {
            if (iconPngCache[size]) return Promise.resolve(iconPngCache[size]);
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const c = document.createElement('canvas');
                        c.width = size; c.height = size;
                        const ctx = c.getContext('2d');
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, size, size);
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        ctx.drawImage(img, 0, 0, size, size);
                        iconPngCache[size] = c.toDataURL('image/png');
                        resolve(iconPngCache[size]);
                    } catch (e) { resolve(IMERYS_SVG_URI); }
                };
                img.onerror = () => resolve(IMERYS_SVG_URI);
                img.src = IMERYS_SVG_URI;
            });
        }

        async function checkStaticAsset(path) {
            if (!window.location.protocol.startsWith('http')) return false;
            try {
                const r = await fetch(path, { method: 'HEAD', cache: 'no-store' });
                return r.ok;
            } catch (e) { return false; }
        }

        function setBrandImages(src) {
            ['header-brand-icon', 'ios-modal-icon'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.src = src;
            });
        }

        function applyManifest(icon192Href, icon512Href) {
            const manifestData = {
                name: 'Escala Imerys',
                short_name: 'Escala Imerys',
                description: 'Escala de Revezamento 3x1 - Britagem ICP 1',
                start_url: window.location.protocol.startsWith('http') ? window.location.href : '.',
                display: 'standalone',
                background_color: '#000000',
                theme_color: '#000000',
                icons: [
                    { src: icon192Href, sizes: '192x192', type: 'image/png', purpose: 'any' },
                    { src: icon512Href, sizes: '512x512', type: 'image/png', purpose: 'any' },
                    { src: icon512Href, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
                ]
            };
            try {
                document.getElementById('pwa-manifest').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestData));
            } catch (e) {}
        }

        async function initAppIcons() {
            setBrandImages(IMERYS_SVG_URI);
            const isHttp = window.location.protocol.startsWith('http');
            const baseUrl = isHttp ? new URL('./', window.location.href).href : '';
            if (isHttp) applyManifest(`${baseUrl}icon-192.png`, `${baseUrl}icon-512.png`);

            const [hasApple, has192, has512] = await Promise.all([
                checkStaticAsset('./apple-touch-icon.png'),
                checkStaticAsset('./icon-192.png'),
                checkStaticAsset('./icon-512.png')
            ]);

            const appleHref = hasApple ? `${baseUrl}apple-touch-icon.png` : await renderIconPNG(180);
            const icon192Href = has192 ? `${baseUrl}icon-192.png` : await renderIconPNG(192);
            const icon512Href = has512 ? `${baseUrl}icon-512.png` : await renderIconPNG(512);

            const appleLink = document.getElementById('apple-icon');

            modalRafs[key][0] = requestAnimationFrame(() => {
                modalRafs[key][0] = 0;

        const STORAGE_KEYS = ['imerys_turma', 'imerys_notes', 'imerys_overrides', 'imerys_atestados', 'imerys_teams'];
        const IDB_NAME = 'EscalaImerysStorage', IDB_STORE = 'kv';

        function safeParseJSON(raw, fallback, expectedType) {
            if (!raw) return fallback;
            try {
                const parsed = JSON.parse(raw);
                if (expectedType === 'array') return Array.isArray(parsed) ? parsed : fallback;
                if (expectedType === 'object') return (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : fallback;
                return parsed;
            } catch (e) { return fallback; }
        }

        const DB = {
            memory: {}, lsAvailable: false, idbAvailable: false, idbInstance: null, persistedGranted: false, warningDismissed: false,
            testLocalStorage() {
                try {
                    localStorage.setItem('__imerys_probe__', '1');
                    this.lsAvailable = localStorage.getItem('__imerys_probe__') === '1';
                    localStorage.removeItem('__imerys_probe__');
                } catch (e) { this.lsAvailable = false; }
                return this.lsAvailable;
            },
            openIDB() {
                return new Promise((resolve) => {
                    if (typeof indexedDB === 'undefined') { this.idbAvailable = false; return resolve(null); }
                    try {
                        const req = indexedDB.open(IDB_NAME, 1);
                        req.onupgradeneeded = (ev) => {
                            const db = ev.target.result;
                            if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
                        };
                        req.onsuccess = (ev) => { this.idbInstance = ev.target.result; this.idbAvailable = true; resolve(this.idbInstance); };
                        req.onerror = () => { this.idbAvailable = false; resolve(null); };
                    } catch (e) { this.idbAvailable = false; resolve(null); }
                });
            },
            idbSet(k, v) {
                if (!this.idbInstance) return Promise.resolve(false);
                return new Promise((resolve) => {
                    try {
                        const tx = this.idbInstance.transaction(IDB_STORE, 'readwrite');
                        tx.objectStore(IDB_STORE).put(String(v), k);
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    } catch (e) { resolve(false); }
                });
            },
            idbGetAll() {
                if (!this.idbInstance) return Promise.resolve({});
                return new Promise((resolve) => {
                    try {
                        const tx = this.idbInstance.transaction(IDB_STORE, 'readonly');
                        const store = tx.objectStore(IDB_STORE), result = {};
                        let pending = STORAGE_KEYS.length;
                        STORAGE_KEYS.forEach((k) => {
                            const req = store.get(k);
                            req.onsuccess = () => { if (req.result !== undefined && req.result !== null) result[k] = String(req.result); if (--pending === 0) resolve(result); };
                            req.onerror = () => { if (--pending === 0) resolve(result); };
                        });
                    } catch (e) { resolve({}); }
                });
            },
            get(k) {
                if (this.lsAvailable) {
                    try { const val = localStorage.getItem(k); if (val !== null) { this.memory[k] = val; return val; } } catch (e) {}
                }
                return Object.prototype.hasOwnProperty.call(this.memory, k) ? this.memory[k] : null;
            },
            set(k, v) {
                const strVal = String(v);
                this.memory[k] = strVal;
                let lsSaved = false;
                try { localStorage.setItem(k, strVal); lsSaved = localStorage.getItem(k) === strVal; this.lsAvailable = lsSaved; }
                catch (e) { this.lsAvailable = false; }
                if (this.idbAvailable && this.idbInstance) this.idbSet(k, strVal);
                return lsSaved || this.idbAvailable;
            },
            flushAll() {
                return [
                    this.set('imerys_turma', currentTurma),
                    this.set('imerys_notes', JSON.stringify(notesDb)),
                    this.set('imerys_overrides', JSON.stringify(overridesDb)),
                    this.set('imerys_atestados', JSON.stringify(atestadosDb)),
                    this.set('imerys_teams', JSON.stringify(teamNames))
                ].every(Boolean);
            },
            isEphemeralEnvironment() {
                const p = window.location.protocol;
                return (p === 'file:' || p === 'content:' || p === 'blob:' || p === 'about:' || !window.origin || window.origin === 'null' || (!this.lsAvailable && !this.idbAvailable));
            }
        };

        /* 9B. RELATÓRIO DE OBSERVAÇÕES — ENCARREGADO & SUPERVISOR DE BRITAGEM (FECHAMENTO MENSAL) */
        function buildSupervisorDataset(teamFilter, sortMode) {
            const year = currentDate.getFullYear(), month = currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const monthLabel = currentDate.toLocaleString('pt-BR', { month: 'long', year: 'numeric' }).toUpperCase();
            const mmStr = String(month + 1).padStart(2, '0');
            const holidaysMap = getHolidays(year, month);
            const targetTeams = teamFilter === 'all' ? [0, 1, 2, 3] : [parseInt(teamFilter, 10)];

            const atByTeam = {};
            targetTeams.forEach(idx => {
                const map = {};
                atestadosDb.filter(r => r.turma === idx).forEach(rec => {
                    const dates = getAtestadoDates(rec);
                    dates.forEach((d, pos) => { map[d] = { dayIndex: pos + 1, totalDays: dates.length }; });
                });
                atByTeam[idx] = map;
            });

            const entries = [];
            const perTeam = [0, 0, 0, 0];
            const uniqueDaysSet = new Set();
            let specialCount = 0;

            for (let day = 1; day <= daysInMonth; day++) {
                const dateKey = `${year}-${mmStr}-${String(day).padStart(2, '0')}`;
                const dow = new Date(year, month, day, 12, 0, 0).getDay();
                const isSunday = dow === 0;
                const holiday = holidaysMap[day] || '';

                targetTeams.forEach(idx => {
                    const text = getNote(dateKey, idx).trim();
                    if (!text) return;
                    const baseShift = getShift(year, month, day, idx);
                    const ovShift = overridesDb[`${dateKey}_${idx}`] || '';
                    const atInfo = atByTeam[idx][dateKey] || null;
                    const code = atInfo ? 'AT' : (ovShift || baseShift);
                    const shiftCfg = SHIFTS_CONFIG[code];
                    const shiftLabel = atInfo ? `Atestado (${atInfo.dayIndex}/${atInfo.totalDays})` : shiftCfg.name;
                    const shiftHours = atInfo ? 'Afastamento' : (shiftCfg.hours || 'Descanso');

                    perTeam[idx]++;
                    uniqueDaysSet.add(day);
                    if (atInfo || ovShift) specialCount++;

                    entries.push({
                        day,
                        dateKey,
                        dateStr: `${String(day).padStart(2, '0')}/${mmStr}`,
                        dowPretty: DOW_PRETTY[dow],
                        dowLabel: DOW_NAMES[dow],
                        isSunday,
                        holiday,
                        turmaIdx: idx,
                        letter: TEAM_LETTERS[idx],
                        teamName: teamNames[idx],
                        code,
                        shiftLabel,
                        shiftHours,
                        isOv: Boolean(!atInfo && ovShift),
                        isAt: Boolean(atInfo),
                        text
                    });
                });
            }

            if (sortMode === 'team') {
                entries.sort((a, b) => (a.turmaIdx - b.turmaIdx) || (a.day - b.day));
            } else {
                entries.sort((a, b) => (a.day - b.day) || (a.turmaIdx - b.turmaIdx));
            }

            const scopeLabel = teamFilter === 'all'
                ? 'Todos os Turnos (A, B, C e D)'
                : `Turno ${TEAM_LETTERS[targetTeams[0]]} (${teamNames[targetTeams[0]]})`;
            const sortLabel = sortMode === 'team' ? 'Agrupado por Turno (A → D)' : 'Ordem Cronológica (Dia 1 → 31)';
            const issued = new Date();
            const issuedStr = `${String(issued.getDate()).padStart(2, '0')}/${String(issued.getMonth() + 1).padStart(2, '0')}/${issued.getFullYear()} às ${String(issued.getHours()).padStart(2, '0')}:${String(issued.getMinutes()).padStart(2, '0')}`;

            return {
                year, month, mmStr, daysInMonth, monthLabel, teamFilter, sortMode,
                scopeLabel, sortLabel, entries, totalNotes: entries.length,
                uniqueDays: uniqueDaysSet.size, perTeam, specialCount, issuedStr
            };
        }

        function wrapCanvasLines(ctx, text, maxW) {
            const paragraphs = String(text || '').replace(/\r\n/g, '\n').split('\n');
            const lines = [];
            paragraphs.forEach((para) => {
                const words = para.split(/\s+/).filter(Boolean);
                if (!words.length) { lines.push(''); return; }
                let current = '';
                words.forEach((word) => {
                    const candidate = current ? `${current} ${word}` : word;
                    if (ctx.measureText(candidate).width <= maxW) {
                        current = candidate;
                    } else {
                        if (current) lines.push(current);
                        if (ctx.measureText(word).width <= maxW) {
                            current = word;
                        } else {
                            let chunk = '';
                            for (const ch of word) {
                                if (ctx.measureText(chunk + ch).width > maxW && chunk) {
                                    lines.push(chunk);
                                    chunk = ch;
                                } else {
                                    chunk += ch;
                                }
                            }
                            current = chunk;
                        }
                    }
                });
                if (current) lines.push(current);
            });
            return lines.length ? lines : [''];
        }

                showToast('Imagem A4 HD baixada com sucesso!');

        async function downloadSupervisorPNG() {
            haptic();
            showToast('Gerando Relatório HD...');
            const data = buildSupervisorDataset(supTeamFilter, supSortMode);
            const W = 2338;
            const font = 'Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            const PALETTE = {
                M: { bg: '#dbeafe', fg: '#1e40af' },
                T: { bg: '#ffedd5', fg: '#9a3412' },
                N: { bg: '#e0e7ff', fg: '#3730a3' },
                F: { bg: '#dcfce7', fg: '#15803d' },
                AT: { bg: '#ffe4e6', fg: '#be123c' }
            };

            const padX = 58, padTop = 50, contentW = W - padX * 2;
            const colDateW = 195, colTeamW = 415, colShiftW = 305;
            const colObsW = contentW - colDateW - colTeamW - colShiftW;

            /* Pré-medição das linhas para nunca cortar nenhuma observação */
            const measureCanvas = document.createElement('canvas');
            const mCtx = measureCanvas.getContext('2d');
            mCtx.font = `600 24px ${font}`;
            const measuredRows = data.entries.map(item => {
                const lines = wrapCanvasLines(mCtx, item.text, colObsW - 44);
                const tags = [];
                if (item.holiday) tags.push({ txt: `FERIADO: ${item.holiday.toUpperCase()}`, bg: '#fee2e2', fg: '#b91c1c', bd: '#fecaca' });
                if (item.isOv) tags.push({ txt: 'TROCA / HORA EXTRA', bg: '#fef3c7', fg: '#92400e', bd: '#fde68a' });
                if (item.isAt) tags.push({ txt: item.shiftLabel.toUpperCase(), bg: '#ffe4e6', fg: '#be123c', bd: '#fecdd3' });
                const textH = lines.length * 34;
                const tagsH = tags.length ? 42 : 0;
                const rowH = Math.max(106, textH + tagsH + 40);
                return { item, lines, tags, rowH };
            });

            const headerBottomY = padTop + 114 + 24;
            const kpiY = headerBottomY + 26, kpiH = 148;
            const tblY = kpiY + kpiH + 28, tblHeadH = 68;
            const rowsTotalH = measuredRows.length ? measuredRows.reduce((acc, r) => acc + r.rowH, 0) : 260;
            const signBlockH = 128, footerBlockH = 74;
            const neededH = tblY + tblHeadH + rowsTotalH + signBlockH + footerBlockH + 44;
            const H = Math.max(1654, neededH);

            const c = document.createElement('canvas');
            c.width = W; c.height = H;
            const ctx = c.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);

            /* 1. Cabeçalho Corporativo */
            const logoImg = await loadLogoImage();
            const logoSize = 114;
            canvasRoundRect(ctx, padX, padTop, logoSize, logoSize, 22);
            ctx.fillStyle = '#ffffff'; ctx.fill();
            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3; ctx.stroke();
            if (logoImg) {
                ctx.save();
                canvasRoundRect(ctx, padX + 3, padTop + 3, logoSize - 6, logoSize - 6, 19);
                ctx.clip();
                ctx.drawImage(logoImg, padX + 3, padTop + 3, logoSize - 6, logoSize - 6);
                ctx.restore();
            }

            ctx.textBaseline = 'top'; ctx.textAlign = 'left';
            ctx.fillStyle = '#0f172a'; ctx.font = `900 46px ${font}`;
            ctx.fillText('RELATÓRIO DE OBSERVAÇÕES — FECHAMENTO', padX + logoSize + 28, padTop + 12);
            ctx.fillStyle = '#475569'; ctx.font = `800 22px ${font}`;
            ctx.fillText('IMERYS • BRITAGEM ICP 1 • ENCARREGADO & SUPERVISOR DE BRITAGEM', padX + logoSize + 28, padTop + 74);

            ctx.font = `900 40px ${font}`;
            const pillW = Math.max(360, ctx.measureText(data.monthLabel).width + 76), pillH = 68;
            const pillX = W - padX - pillW, pillY = padTop + 4;
            canvasRoundRect(ctx, pillX, pillY, pillW, pillH, 18);
            ctx.fillStyle = '#0f172a'; ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(data.monthLabel, pillX + pillW / 2, pillY + pillH / 2 + 1);

            ctx.textAlign = 'right'; ctx.textBaseline = 'top';
            ctx.fillStyle = '#475569'; ctx.font = `700 20px ${font}`;
            ctx.fillText(`${data.scopeLabel} • ${data.sortLabel}`, W - padX, pillY + pillH + 14);

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(padX, headerBottomY, contentW, 5);

            /* 2. Faixa de KPIs */
            const gap = 22;
            const kw1 = Math.round((contentW - gap * 3) * 0.20);
            const kw2 = Math.round((contentW - gap * 3) * 0.20);
            const kw3 = Math.round((contentW - gap * 3) * 0.37);
            const kw4 = contentW - gap * 3 - kw1 - kw2 - kw3;
            const kx1 = padX, kx2 = kx1 + kw1 + gap, kx3 = kx2 + kw2 + gap, kx4 = kx3 + kw3 + gap;

            const drawKpi = (x, w, label, val, sub) => {
                canvasRoundRect(ctx, x, kpiY, w, kpiH, 18);
                ctx.fillStyle = '#f8fafc'; ctx.fill();
                ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2.5; ctx.stroke();
                ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                ctx.fillStyle = '#475569'; ctx.font = `900 18px ${font}`;
                ctx.fillText(label, x + 24, kpiY + 20);
                if (val !== null) {
                    ctx.fillStyle = '#0f172a'; ctx.font = `900 44px ${font}`;
                    ctx.fillText(String(val), x + 24, kpiY + 50);
                }
                if (sub) {
                    ctx.fillStyle = '#64748b'; ctx.font = `700 19px ${font}`;
                    ctx.fillText(sub, x + 24, kpiY + 106);
                }
            };

            drawKpi(kx1, kw1, 'OBSERVAÇÕES NO MÊS', data.totalNotes, 'Registros filtrados');
            drawKpi(kx2, kw2, 'DIAS COM REGISTRO', data.uniqueDays, `de ${data.daysInMonth} dias do mês`);
            drawKpi(kx3, kw3, 'OBSERVAÇÕES POR TURNO', null, '');
            const chipGap = 14, chipW = Math.floor((kw3 - 48 - chipGap * 3) / 4);
            TEAM_LETTERS.forEach((ltr, idx) => {
                const cx = kx3 + 24 + idx * (chipW + chipGap), cy = kpiY + 58;
                canvasRoundRect(ctx, cx, cy, chipW, 64, 12);
                ctx.fillStyle = '#ffffff'; ctx.fill();
                ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2; ctx.stroke();
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = '#0f172a'; ctx.font = `900 26px ${font}`;
                ctx.fillText(`${ltr}: ${data.perTeam[idx]}`, cx + chipW / 2, cy + 33);
            });
            drawKpi(kx4, kw4, 'LIGADAS A EXTRA / ATESTADO', data.specialCount, 'Ocorrências com alteração');

            /* 3. Tabela de Observações */
            const tblH = Math.max(H - tblY - signBlockH - footerBlockH - 36, tblHeadH + rowsTotalH);
            ctx.save();
            canvasRoundRect(ctx, padX, tblY, contentW, tblH, 18);
            ctx.clip();

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(padX, tblY, contentW, tblH);

            /* Cabeçalho da Tabela */
            ctx.fillStyle = '#f1f5f9';
            ctx.fillRect(padX, tblY, contentW, tblHeadH);
            ctx.fillStyle = '#0f172a'; ctx.font = `900 20px ${font}`;
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.fillText('DATA', padX + 22, tblY + tblHeadH / 2);
            ctx.fillText('TURNO / EQUIPE', padX + colDateW + 22, tblY + tblHeadH / 2);
            ctx.fillText('ESCALA DO DIA', padX + colDateW + colTeamW + 22, tblY + tblHeadH / 2);
            ctx.fillText('OBSERVAÇÃO / OCORRÊNCIA REGISTRADA', padX + colDateW + colTeamW + colShiftW + 22, tblY + tblHeadH / 2);

            if (measuredRows.length === 0) {
                const midY = tblY + tblHeadH + (tblH - tblHeadH) / 2;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = '#0f172a'; ctx.font = `900 32px ${font}`;
                ctx.fillText('Nenhuma observação registrada neste mês', padX + contentW / 2, midY - 18);
                ctx.fillStyle = '#64748b'; ctx.font = `600 23px ${font}`;
                ctx.fillText(`Escopo: ${data.scopeLabel} • Fechamento mensal sem ocorrências anotadas.`, padX + contentW / 2, midY + 24);
            } else {
                let curY = tblY + tblHeadH;
                measuredRows.forEach(({ item, lines, tags, rowH }, idx) => {
                    if (idx % 2 === 1) {
                        ctx.fillStyle = '#f8fafc';
                        ctx.fillRect(padX, curY, contentW, rowH);
                    }

                    const isRed = item.isSunday || Boolean(item.holiday);
                    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                    ctx.fillStyle = isRed ? '#dc2626' : '#0f172a';
                    ctx.font = `900 28px ${font}`;
                    ctx.fillText(item.dateStr, padX + 22, curY + 22);
                    ctx.fillStyle = isRed ? '#dc2626' : '#64748b';
                    ctx.font = `800 19px ${font}`;
                    ctx.fillText(item.dowPretty.toUpperCase(), padX + 22, curY + 58);

                    /* Turno */
                    const tx = padX + colDateW + 22;
                    canvasRoundRect(ctx, tx, curY + 20, 38, 38, 10);
                    ctx.fillStyle = '#0f172a'; ctx.fill();
                    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.font = `900 21px ${font}`;
                    ctx.fillText(item.letter, tx + 19, curY + 40);

                    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#0f172a'; ctx.font = `900 26px ${font}`;
                    ctx.fillText(`Turno ${item.letter}`, tx + 50, curY + 40);
                    ctx.textBaseline = 'top';
                    ctx.fillStyle = '#475569'; ctx.font = `700 20px ${font}`;
                    ctx.fillText(canvasTruncateText(ctx, item.teamName, colTeamW - 44), tx, curY + 66);

                    /* Escala do dia */
                    const sx = padX + colDateW + colTeamW + 22;
                    const p = PALETTE[item.code] || PALETTE.F;
                    const pillTxt = `${item.code} • ${item.isAt ? 'Atestado' : item.shiftLabel}`;
                    ctx.font = `900 21px ${font}`;
                    const spW = Math.min(colShiftW - 44, ctx.measureText(pillTxt).width + 32);
                    canvasRoundRect(ctx, sx, curY + 20, spW, 40, 10);
                    ctx.fillStyle = p.bg; ctx.fill();
                    if (item.isOv) { ctx.strokeStyle = '#d97706'; ctx.lineWidth = 3.5; ctx.stroke(); }
                    ctx.fillStyle = p.fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(pillTxt, sx + spW / 2, curY + 41);

                    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                    ctx.fillStyle = '#64748b'; ctx.font = `700 18px ${font}`;
                    ctx.fillText(item.shiftHours, sx, curY + 68);

                    /* Observação */
                    const ox = padX + colDateW + colTeamW + colShiftW + 22;
                    ctx.fillStyle = '#0f172a'; ctx.font = `600 24px ${font}`;
                    lines.forEach((ln, li) => {
                        ctx.fillText(ln, ox, curY + 20 + li * 34);
                    });

                    if (tags.length) {
                        let tagX = ox;
                        const tagY = curY + 24 + lines.length * 34;
                        ctx.font = `800 16px ${font}`;
                        tags.forEach(tg => {
                            const tw = Math.min(colObsW - 44, ctx.measureText(tg.txt).width + 22);
                            if (tagX + tw > ox + colObsW - 44) return;
                            canvasRoundRect(ctx, tagX, tagY, tw, 28, 7);
                            ctx.fillStyle = tg.bg; ctx.fill();
                            ctx.strokeStyle = tg.bd; ctx.lineWidth = 1.5; ctx.stroke();
                            ctx.fillStyle = tg.fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                            ctx.fillText(tg.txt, tagX + tw / 2, tagY + 15);
                            tagX += tw + 10;
                        });
                    }

                    curY += rowH;
                    ctx.fillStyle = '#e2e8f0';
                    ctx.fillRect(padX, curY, contentW, 2);
                });

                /* Linhas verticais das colunas */
                ctx.fillStyle = '#e2e8f0';
                [colDateW, colDateW + colTeamW, colDateW + colTeamW + colShiftW].forEach(offset => {
                    ctx.fillRect(padX + offset, tblY, 2, tblH);
                });
            }

            ctx.fillStyle = '#475569';
            ctx.fillRect(padX, tblY + tblHeadH, contentW, 4);
            ctx.restore();

            canvasRoundRect(ctx, padX, tblY, contentW, tblH, 18);
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 3.5; ctx.stroke();

            /* 4. Assinaturas / Vistos */
            const signY = H - footerBlockH - 58;
            const sGap = 56;
            const sw1 = Math.round((contentW - sGap * 2) * 0.37);
            const sw2 = sw1;
            const sw3 = contentW - sGap * 2 - sw1 - sw2;
            const signs = [
                { x: padX, w: sw1, lbl: 'VISTO — ENCARREGADO DE BRITAGEM' },
                { x: padX + sw1 + sGap, w: sw2, lbl: 'VISTO — SUPERVISOR DE BRITAGEM' },
                { x: padX + sw1 + sw2 + sGap * 2, w: sw3, lbl: 'DATA DO FECHAMENTO: ____/____/______' }
            ];
            signs.forEach(s => {
                ctx.fillStyle = '#475569';
                ctx.fillRect(s.x, signY, s.w, 2.5);
                ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                ctx.fillStyle = '#334155'; ctx.font = `800 19px ${font}`;
                ctx.fillText(s.lbl, s.x + s.w / 2, signY + 12);
            });

            /* 5. Rodapé */
            const footY = H - 52;
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(padX, footY - 14, contentW, 2);
            ctx.textBaseline = 'top'; ctx.fillStyle = '#64748b'; ctx.font = `700 19px ${font}`;
            ctx.textAlign = 'left';
            ctx.fillText('Imerys • Britagem ICP 1 • Relatório Gerencial de Observações (Uso Interno da Liderança)', padX, footY);
            ctx.textAlign = 'right';
            ctx.fillText(`Emitido em ${data.issuedStr} • Formato A4 Horizontal (HD)`, W - padX, footY);

            const suffix = data.teamFilter === 'all' ? 'Geral' : `Turno_${TEAM_LETTERS[parseInt(data.teamFilter, 10)]}`;
            const fileName = `Relatorio_Observacoes_Britagem_${suffix}_${data.mmStr}_${data.year}.png`;
            c.toBlob((blob) => {
                if (!blob) { showToast('Não foi possível gerar o relatório.'); return; }
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.setAttribute('download', fileName);
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => window.URL.revokeObjectURL(url), 1500);
                showToast('Relatório de Observações HD baixado!');
            }, 'image/png');
        }

            if (!modalAtestadoEnabled) {
                if (subtitle) subtitle.textContent = 'Marcar dias e calcular retorno';
                if (notice) notice.classList.add('hidden');
                return;
            }

            const startDate = modalAtestadoStartDate || currentModalDateStr;
            const rawDays = parseInt(daysInput ? daysInput.value : '1', 10);
            const days = Math.max(1, Math.min(180, isNaN(rawDays) ? 1 : rawDays));
            const info = getAtestadoReturnInfo(startDate, days, currentTurma);
            const retCfg = SHIFTS_CONFIG[info.returnShift] || SHIFTS_CONFIG.M;

            if (subtitle) {
                subtitle.textContent = `${days} ${days === 1 ? 'dia' : 'dias'} • Volta em ${formatDateShortBR(info.returnDateStr)}`;
            }
            if (notice) {
                if (startDate !== currentModalDateStr) {
                    const startNote = getNote(startDate, currentTurma).trim();
                    notice.textContent = startNote
                        ? `Atestado iniciado em ${formatDateShortBR(startDate)} (Obs. inicial: "${startNote}")`
                        : `Editando atestado iniciado em ${formatDateShortBR(startDate)}.`;
                    notice.classList.remove('hidden');
                } else {
                    notice.classList.add('hidden');
                }
            }
            if (previewBox) {
                const folgaMsg = info.skippedFolgas > 0
                    ? `<div class="mt-1 text-[11px] font-semibold text-sky-700 dark:text-sky-300">Emenda com ${info.skippedFolgas} ${info.skippedFolgas === 1 ? 'dia de folga' : 'dias de folga'} da escala.</div>`
                    : '';
                previewBox.innerHTML = `
                    <div class="font-bold text-slate-800 dark:text-slate-100">Afastamento: <span class="text-rose-600 dark:text-rose-400">${formatDateShortBR(info.startDateStr)} até ${formatDateShortBR(info.endDateStr)}</span></div>
                    <div class="mt-1 font-extrabold text-sky-800 dark:text-sky-200">Retorno ao trabalho: ${formatDateFullBR(info.returnDateStr)} (${retCfg.name}${retCfg.hours ? ' • ' + retCfg.hours : ''})</div>
                    ${folgaMsg}
                `;
            }
        }

        function openNoteModal(dateKey) {
            if (!dateKey) return;
            haptic();
            currentModalDateStr = dateKey;
            modalDirty = false;

            const guard = document.getElementById('unsaved-guard');
            if (guard) guard.classList.add('hidden');

            const titleEl = document.getElementById('modal-date-title');
            if (titleEl) {
                titleEl.textContent = `Dia ${formatDateShortBR(dateKey)} • Turno ${TEAM_LETTERS[currentTurma]}`;
            }

            currentSelectedOverride = overridesDb[`${dateKey}_${currentTurma}`] || '';
            const cov = findAtestadoCovering(dateKey, currentTurma);
            const daysInput = document.getElementById('atestado-days-input');

            if (cov) {
                modalAtestadoEnabled = true;
                modalEditingAtestadoId = cov.record.id;
                modalAtestadoStartDate = cov.record.startDate;
                if (daysInput) daysInput.value = String(cov.record.days);
            } else {
                modalAtestadoEnabled = false;
                modalEditingAtestadoId = null;
                modalAtestadoStartDate = dateKey;
                if (daysInput) daysInput.value = '1';
            }

            const noteEl = document.getElementById('note-text');
            if (noteEl) noteEl.value = getNote(dateKey, currentTurma);

            updateOverrideButtonsUI();
            updateAtestadoUI();
            openAnimatedModal('note', 'note-modal', 'modal-content');
        }
        window.openModal = openNoteModal;

        function markModalDirty() {
            modalDirty = true;
            const guard = document.getElementById('unsaved-guard');
            if (guard) guard.classList.add('hidden');
        }

        function selectOverride(val) {
            haptic();
            currentSelectedOverride = val || '';
            if (currentSelectedOverride && modalAtestadoEnabled) modalAtestadoEnabled = false;
            updateOverrideButtonsUI();
            updateAtestadoUI();
            markModalDirty();
        }

        function toggleAtestadoMode() {
            haptic();
            modalAtestadoEnabled = !modalAtestadoEnabled;
            if (modalAtestadoEnabled) {
                currentSelectedOverride = '';
                if (!modalAtestadoStartDate) modalAtestadoStartDate = currentModalDateStr;
            }
            updateOverrideButtonsUI();
            updateAtestadoUI();
            markModalDirty();
        }

        function adjustAtestadoDays(delta) {
            haptic();
            const inp = document.getElementById('atestado-days-input');
            if (!inp) return;
            const cur = parseInt(inp.value, 10) || 1;
            inp.value = String(Math.max(1, Math.min(180, cur + delta)));
            updateAtestadoUI();
            markModalDirty();
        }

        function onAtestadoDaysInput() {
            updateAtestadoUI();
            markModalDirty();
        }

        function setAtestadoDays(n) {
            haptic();
            const inp = document.getElementById('atestado-days-input');
            if (!inp) return;
            inp.value = String(Math.max(1, Math.min(180, n)));
            updateAtestadoUI();
            markModalDirty();
        }

        function requestCloseModal() {
            if (modalDirty) {
                const guard = document.getElementById('unsaved-guard');
                if (guard) {
                    guard.classList.remove('hidden');
                    guard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    return;
                }
            }
            closeModal();
        }

        function closeModal() {
            modalDirty = false;
            const guard = document.getElementById('unsaved-guard');
            if (guard) guard.classList.add('hidden');
            closeAnimatedModal('note', 'note-modal', 'modal-content');
        }

        function saveNote() {
            if (!currentModalDateStr) return;
            haptic();
            const noteEl = document.getElementById('note-text');
            const text = noteEl ? noteEl.value.trim() : '';
            const ovKey = `${currentModalDateStr}_${currentTurma}`;

            setNote(currentModalDateStr, currentTurma, text);

            if (modalAtestadoEnabled || !currentSelectedOverride) delete overridesDb[ovKey];
            else overridesDb[ovKey] = currentSelectedOverride;

            if (modalAtestadoEnabled) {
                const inp = document.getElementById('atestado-days-input');
                const days = Math.max(1, Math.min(180, parseInt(inp ? inp.value : '1', 10) || 1));
                const startDate = modalAtestadoStartDate || currentModalDateStr;
                const newDatesSet = new Set(getAtestadoDates({ startDate, days }));

                atestadosDb = atestadosDb.filter(rec => {
                    if (rec.turma !== currentTurma) return true;
                    if (modalEditingAtestadoId && rec.id === modalEditingAtestadoId) return false;
                    return !getAtestadoDates(rec).some(d => newDatesSet.has(d));
                });

                atestadosDb.push({
                    id: modalEditingAtestadoId || (`at_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`),
                    turma: currentTurma,
                    startDate,
                    days
                });
            } else if (modalEditingAtestadoId) {
                atestadosDb = atestadosDb.filter(rec => rec.id !== modalEditingAtestadoId);
            }

            const ok = DB.flushAll();
            closeModal();
            renderApp({ preserveScroll: true, scrollToToday: false });
            showToast(ok ? 'Alterações salvas!' : 'Salvo apenas nesta sessão.');
        }

        function deleteNote() {
            if (!currentModalDateStr) return;
            haptic();
            setNote(currentModalDateStr, currentTurma, '');
            delete overridesDb[`${currentModalDateStr}_${currentTurma}`];
            if (modalEditingAtestadoId) {
                atestadosDb = atestadosDb.filter(rec => rec.id !== modalEditingAtestadoId);
            }
            DB.flushAll();
            closeModal();
            renderApp({ preserveScroll: true, scrollToToday: false });
            showToast('Registro do dia limpo!');
        }

        /* 11. EXPORTAÇÃO PARA AGENDA (.ICS) */
        function exportICS() {
            haptic();
            const year = currentDate.getFullYear(), month = currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const mmStr = String(month + 1).padStart(2, '0');
            const teamLetter = TEAM_LETTERS[currentTurma];
            const teamDesc = teamNames[currentTurma] || DEFAULT_TEAM_DESC[currentTurma];
            const escICS = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
            const pad2 = (n) => String(n).padStart(2, '0');
            const dtStamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

            const lines = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Escala Imerys//Britagem ICP 1//PT-BR',
                'CALSCALE:GREGORIAN',
                `X-WR-CALNAME:Escala Imerys - Turno ${teamLetter}`
            ];

            for (let day = 1; day <= daysInMonth; day++) {
                const ddStr = pad2(day);
                const dateKey = `${year}-${mmStr}-${ddStr}`;
                const cov = findAtestadoCovering(dateKey, currentTurma);
                const ov = overridesDb[`${dateKey}_${currentTurma}`] || '';
                const base = getShift(year, month, day, currentTurma);
                const code = cov ? 'AT' : (ov || base);
                const note = getNote(dateKey, currentTurma).trim();
                const cfg = SHIFTS_CONFIG[code];

                if (code === 'F' && !note) continue;

                const summary = cov
                    ? `Imerys (${teamLetter}) - Atestado (${cov.dayIndex}/${cov.totalDays})`
                    : `Imerys (${teamLetter}) - ${cfg.name}${ov ? ' [Extra/Troca]' : ''}`;
                const descParts = [`Turno ${teamLetter}: ${teamDesc}`];
                if (cfg.hours) descParts.push(`Horário: ${cfg.hours}`);
                if (note) descParts.push(`Obs: ${note}`);

                const nextKey = addDaysKey(dateKey, 1).replace(/-/g, '');
                const curCompact = `${year}${mmStr}${ddStr}`;

                lines.push('BEGIN:VEVENT');
                lines.push(`UID:imerys-${dateKey}-t${currentTurma}@escala-icp1`);
                lines.push(`DTSTAMP:${dtStamp}`);
                if (code === 'M') {
                    lines.push(`DTSTART:${curCompact}T050000`);
                    lines.push(`DTEND:${curCompact}T130000`);
                } else if (code === 'T') {
                    lines.push(`DTSTART:${curCompact}T130000`);
                    lines.push(`DTEND:${curCompact}T210000`);
                } else if (code === 'N') {
                    lines.push(`DTSTART:${curCompact}T210000`);
                    lines.push(`DTEND:${nextKey}T050000`);
                } else {
                    lines.push(`DTSTART;VALUE=DATE:${curCompact}`);
                    lines.push(`DTEND;VALUE=DATE:${nextKey}`);
                }
                lines.push(`SUMMARY:${escICS(summary)}`);
                lines.push(`DESCRIPTION:${escICS(descParts.join('\n'))}`);
                lines.push('END:VEVENT');
            }

            lines.push('END:VCALENDAR');
            const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Escala-Imerys-Turno-${teamLetter}-${year}-${mmStr}.ics`;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
            showToast(`Agenda .ICS (Turno ${teamLetter}) baixada!`);
        }

        /* 12. EVENTOS GLOBAIS, TECLADO, SCROLL 120/144Hz E INICIALIZAÇÃO */
        function hydrateStateFromDB() {
            const savedTurma = parseInt(DB.get('imerys_turma'), 10);
            if ([0, 1, 2, 3].includes(savedTurma)) currentTurma = savedTurma;

            const rawNotes = safeParseJSON(DB.get('imerys_notes'), {}, 'object');
            notesDb = (rawNotes && typeof rawNotes === 'object' && !Array.isArray(rawNotes)) ? rawNotes : {};

            const rawOv = safeParseJSON(DB.get('imerys_overrides'), {}, 'object');
            overridesDb = (rawOv && typeof rawOv === 'object' && !Array.isArray(rawOv)) ? rawOv : {};

            const rawAt = safeParseJSON(DB.get('imerys_atestados'), [], 'array');
            atestadosDb = Array.isArray(rawAt) ? rawAt : [];

            const rawTeams = safeParseJSON(DB.get('imerys_teams'), null, 'array');
            if (Array.isArray(rawTeams) && rawTeams.length === 4) {
                teamNames = rawTeams.map((v, i) => (typeof v === 'string' && v.trim()) ? v.trim().slice(0, 32) : DEFAULT_TEAM_DESC[i]);
            } else {
                teamNames = [...DEFAULT_TEAM_DESC];
            }

            if (migrateLegacyNotes(currentTurma)) {
                DB.set('imerys_notes', JSON.stringify(notesDb));
            }
        }

        function bindGlobalEvents() {
            const tbodyEl = document.getElementById('schedule-tbody');
            if (tbodyEl) {
                tbodyEl.addEventListener('click', (e) => {
                    const td = e.target.closest('td[data-date]');
                    if (td) openNoteModal(td.dataset.date);
                });
            }

            const atContainer = document.getElementById('atestados-container');
            if (atContainer) {
                atContainer.addEventListener('click', (e) => {
                    const target = e.target.closest('[data-date], [data-open-date]');
                    if (target) openNoteModal(target.dataset.date || target.dataset.openDate);
                });
            }

            /* Shift + Scroll suave independente de Hz (60/90/120/144Hz+) */
            const scroller = document.getElementById('table-scroll-container');
            if (scroller) {
                const stepWheel = (ts) => {
                    if (wheelTargetX === null) { wheelRaf = 0; return; }
                    const dt = wheelLastTs ? Math.min(0.05, (ts - wheelLastTs) / 1000) : (1 / 60);
                    wheelLastTs = ts;
                    const diff = wheelTargetX - scroller.scrollLeft;
                    if (Math.abs(diff) < 0.75) {
                        scroller.scrollLeft = wheelTargetX;
                        wheelTargetX = null;
                        wheelRaf = 0;
                        return;
                    }
                    scroller.scrollLeft += diff * (1 - Math.exp(-16 * dt));
                    wheelRaf = requestAnimationFrame(stepWheel);
                };

                scroller.addEventListener('wheel', (e) => {
                    if (!e.shiftKey || scroller.scrollWidth <= scroller.clientWidth) return;
                    const delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
                    if (!delta) return;
                    e.preventDefault();
                    const maxScroll = scroller.scrollWidth - scroller.clientWidth;
                    if (prefersReducedMotion()) {
                        scroller.scrollLeft = Math.max(0, Math.min(maxScroll, scroller.scrollLeft + delta));
                        return;
                    }
                    const base = wheelTargetX !== null ? wheelTargetX : scroller.scrollLeft;
                    wheelTargetX = Math.max(0, Math.min(maxScroll, base + delta));
                    if (!wheelRaf) {
                        wheelLastTs = 0;
                        wheelRaf = requestAnimationFrame(stepWheel);
                    }
                }, { passive: false });
            }

            /* Atalhos de teclado no Desktop */
            document.addEventListener('keydown', (e) => {
                const noteOpen = !document.getElementById('note-modal')?.classList.contains('hidden');
                const exportOpen = !document.getElementById('export-modal')?.classList.contains('hidden');
                const teamsOpen = !document.getElementById('teams-modal')?.classList.contains('hidden');
                const infoOpen = !document.getElementById('info-modal')?.classList.contains('hidden');
                const iosOpen = !document.getElementById('ios-install-modal')?.classList.contains('hidden');

                if (e.key === 'Escape') {
                    if (noteOpen) requestCloseModal();
                    else if (exportOpen) closeExportModal();
                    else if (teamsOpen) closeTeamsModal();
                    else if (infoOpen) closeInfoModal();
                    else if (iosOpen) closeIosInstallPrompt();
                    return;
                }

                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                    if (noteOpen) { e.preventDefault(); saveNote(); }
                    else if (teamsOpen) { e.preventDefault(); saveTeamNames(); }
                    return;
                }

                if (isAnyModalOpen()) return;
                const tag = (document.activeElement && document.activeElement.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

                if (e.key === 'ArrowLeft') changeMonth(-1);
                else if (e.key === 'ArrowRight') changeMonth(1);
                else if (e.key === 't' || e.key === 'T') goToToday();
            });

            window.addEventListener('resize', () => {
                updateSwipeHintVisibility();
                if (!document.getElementById('export-modal')?.classList.contains('hidden')) {
                    scaleA4Preview();
                }
            }, { passive: true });

            /* Garante folha A4 sempre pronta se o usuário apertar Ctrl+P / Cmd+P direto no PC */
            window.addEventListener('beforeprint', () => {
                const printEl = document.getElementById('print-sheet');
                if (!printEl) return;
                const exportOpen = !document.getElementById('export-modal')?.classList.contains('hidden');
                if (exportOpen && exportMode === 'supervisor') {
                    printEl.innerHTML = buildSupervisorSheetHTML(buildSupervisorDataset(supTeamFilter, supSortMode));
                } else {
                    printEl.innerHTML = buildA4SheetHTML(buildA4Dataset(a4IncludeChanges));
                }
            });

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                const btn = document.getElementById('install-btn');
                if (btn && !isInStandaloneMode()) btn.classList.remove('hidden');
            });

            window.addEventListener('appinstalled', () => {
                deferredPrompt = null;
                const btn = document.getElementById('install-btn');
                if (btn) btn.classList.add('hidden');
                showToast('Escala Imerys instalada!');
            });
        }

        async function initApp() {
            hydrateStateFromDB();
            bindGlobalEvents();
            updateTeamSelectorUI();
            renderApp({ scrollToToday: true });
            updateStorageHealthUI();
            initAppIcons();

            if (isIosDevice() && !isInStandaloneMode()) {
                const btn = document.getElementById('install-btn');
                if (btn) btn.classList.remove('hidden');
            }

            /* Sincronização chave por chave com IndexedDB */
            await DB.openIDB();
            if (DB.idbAvailable) {
                const idbData = await DB.idbGetAll();
                let restoredFromIDB = false;
                STORAGE_KEYS.forEach((k) => {
                    const localVal = DB.get(k);
                    const idbVal = Object.prototype.hasOwnProperty.call(idbData, k) ? idbData[k] : null;
                    if (localVal === null && idbVal !== null) {
                        DB.memory[k] = idbVal;
                        if (DB.lsAvailable) { try { localStorage.setItem(k, idbVal); } catch (e) {} }
                        restoredFromIDB = true;
                    } else if (localVal !== null && idbVal === null) {
                        DB.idbSet(k, localVal);
                    }
                });
                if (restoredFromIDB) {
                    hydrateStateFromDB();
                    updateTeamSelectorUI();
                    renderApp({ preserveScroll: true, scrollToToday: false });
                }
            }

            if (navigator.storage && navigator.storage.persist) {
                try { DB.persistedGranted = await navigator.storage.persist(); } catch (e) {}
            }
            updateStorageHealthUI();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp, { once: true });
        } else {
            initApp();
        }
    </script>
</body>
